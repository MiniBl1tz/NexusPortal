<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusPortal | Next-Gen Community Gateway</title>

    <meta name="description" content="Next-generation community portal and resource hub. Powered by NexusPortal.">
    <meta property="og:title" content="NexusPortal — Community Gateway">
    <meta property="og:description" content="Access official channels, real-time platform metrics, and community guidelines.">
    <meta name="theme-color" content="#0ea5e9">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #0ea5e9;
            --primary-rgb: 14, 165, 233;
            --accent: #6366f1;
            --bg-base: #030712;
            --surface: rgba(15, 23, 42, 0.65);
            --surface-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }

        /* Preset Themes */
        body[data-theme="violet"] {
            --primary: #a855f7;
            --primary-rgb: 168, 85, 247;
            --accent: #ec4899;
        }

        body[data-theme="emerald"] {
            --primary: #10b981;
            --primary-rgb: 16, 185, 129;
            --accent: #06b6d4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            position: relative;
            overflow-x: hidden;
        }

        /* Interactive Particle Background */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .portal-card {
            width: 100%;
            max-width: 460px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 28px;
            padding: 38px 28px 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7),
                        0 0 50px rgba(var(--primary-rgb), 0.15);
            position: relative;
            z-index: 10;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top Controls */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .telemetry-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 5px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--success);
            font-family: 'JetBrains Mono', monospace;
        }

        .pulse-indicator {
            width: 6px;
            height: 6px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Theme Selector */
        .theme-selector {
            display: flex;
            gap: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--surface-border);
            padding: 4px;
            border-radius: 100px;
        }

        .theme-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .theme-dot:hover { transform: scale(1.2); }
        .theme-cyan { background: #0ea5e9; }
        .theme-violet { background: #a855f7; }
        .theme-emerald { background: #10b981; }

        /* Custom Vector Logo */
        .logo-wrap {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            position: relative;
        }

        .logo-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 16px rgba(var(--primary-rgb), 0.5));
            transition: all 0.3s ease;
        }

        /* Branding */
        .title-block {
            text-align: center;
            margin-bottom: 24px;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 24px;
            text-align: center;
        }

        .metric-item .val {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .metric-item .lbl {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        /* Dynamic Buttons */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .action-btn:hover {
            background: rgba(var(--primary-rgb), 0.08);
            border-color: rgba(var(--primary-rgb), 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(var(--primary-rgb), 0.2);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .btn-icon {
            font-size: 1.25rem;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            border: 1px solid var(--surface-border);
        }

        .btn-text .btn-label {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .btn-text .btn-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .btn-chevron {
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: transform 0.2s;
        }

        .action-btn:hover .btn-chevron {
            transform: translateX(4px);
            color: var(--primary);
        }

        /* Footer */
        .card-footer {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .card-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .share-pill {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .share-pill:hover {
            color: var(--text-main);
            border-color: var(--primary);
        }

        /* Modal Overlay */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(3, 7, 18, 0.75);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-panel {
            background: #0f172a;
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            max-width: 420px;
            width: 100%;
            padding: 28px;
            animation: modalEnter 0.2s ease-out;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }

        @keyframes modalEnter {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .rules-timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }

        .rule-entry {
            display: flex;
            gap: 12px;
            font-size: 0.88rem;
            line-height: 1.4;
        }

        .rule-num {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 700;
        }

        /* Toast system */
        .toast-system {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--primary);
            color: var(--text-main);
            padding: 10px 22px;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        .toast-system.active {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- Particle canvas -->
    <canvas id="bgCanvas"></canvas>

    <main class="portal-card">
        <!-- Card Header -->
        <div class="card-header">
            <div class="telemetry-badge">
                <span class="pulse-indicator"></span>
                <span id="cfgStatus">OPERATIONAL</span>
            </div>
            
            <!-- Quick Theme Switcher -->
            <div class="theme-selector" title="Switch Theme Accent">
                <button class="theme-dot theme-cyan" onclick="setTheme('default')"></button>
                <button class="theme-dot theme-violet" onclick="setTheme('violet')"></button>
                <button class="theme-dot theme-emerald" onclick="setTheme('emerald')"></button>
            </div>
        </div>

        <!-- Custom Scalable Vector Logo -->
        <div class="logo-wrap">
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="2" stroke-opacity="0.1" />
                <polygon points="50,14 82,32 82,68 50,86 18,68 18,32" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="rgba(var(--primary-rgb), 0.05)" />
                <path d="M50 26 L70 38 V62 L50 74 L30 62 V38 Z" fill="var(--primary)" fill-opacity="0.25" stroke="var(--accent)" stroke-width="2" />
                <circle cx="50" cy="50" r="6" fill="#ffffff" />
            </svg>
        </div>

        <!-- Titles -->
        <div class="title-block">
            <h1 class="main-title" id="cfgTitle">NexusPortal</h1>
            <p class="subtitle" id="cfgTagline">Next-generation ecosystem gateway curated by MiniBl1tz</p>
        </div>

        <!-- Live Platform Telemetry -->
        <div class="metrics-grid" id="metricsContainer"></div>

        <!-- Dynamic Action Links -->
        <div class="links-container" id="linksContainer"></div>

        <!-- Footer -->
        <footer class="card-footer">
            <span>Core by <a href="https://github.com/MiniBl1tz" target="_blank" id="cfgAuthor">MiniBl1tz</a></span>
            <button class="share-pill" onclick="shareGateway()">
                <span>Share Portal</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
            </button>
        </footer>
    </main>

    <!-- Modal Window (Community Rules) -->
    <div class="modal-backdrop" id="rulesModal" onclick="closeRules()">
        <div class="modal-panel" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>📜 Protocol Guidelines</h3>
                <button class="modal-close" onclick="closeRules()">&times;</button>
            </div>
            <div class="rules-timeline" id="rulesContainer"></div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div class="toast-system" id="toast">
        <span id="toastMsg">Action completed</span>
    </div>

    <!-- ==========================================
         ENGINEER CONFIGURATION PANEL
         (Modify everything right here!)
    =========================================== -->
    <script>
        const CONFIG = {
            // General Info
            title: "NexusPortal",
            tagline: "High-performance community infrastructure crafted by MiniBl1tz",
            status: "SYSTEMS ONLINE",
            author: "MiniBl1tz",

            // Real-Time Community Metrics
            metrics: [
                { label: "Community", value: "3.2K+" },
                { label: "Latency", value: "14ms" },
                { label: "Uptime", value: "99.9%" }
            ],

            // Action Links
            // Types: "copy" (copies value to clipboard), "modal" (opens rules), "link" (opens url)
            actions: [
                {
                    type: "copy",
                    icon: "💬",
                    label: "Join Community Discord",
                    desc: "Click to copy official invite link",
                    value: "https://discord.gg/pcmqpZcqQ"
                },
                {
                    type: "modal",
                    icon: "📜",
                    label: "Community Rules & Standards",
                    desc: "Review behavior guidelines & security policies"
                },
                {
                    type: "link",
                    icon: "💻",
                    label: "GitHub Source & Projects",
                    desc: "Explore public codebases and tools",
                    url: "https://github.com/MiniBl1tz"
                },
                {
                    type: "link",
                    icon: "⚡",
                    label: "Official Updates & Announcements",
                    desc: "Follow the latest releases",
                    url: "https://twitter.com"
                }
            ],

            // Guidelines listed inside the Rules modal
            rules: [
                { title: "Zero Hostility", desc: "Harassment, hate speech, and bad-faith behavior are strictly prohibited." },
                { title: "No Spam or Exploits", desc: "Do not post malicious links, automated scripts, or unsolicited ads." },
                { title: "Knowledge Sharing", desc: "Foster an environment of open-source growth and peer learning." },
                { title: "Verify Everything", desc: "Ensure dependencies and community scripts are reviewed before execution." }
            ]
        };

        // --- Core Application Engine ---
        function initPortal() {
            // Set text items
            document.getElementById('cfgTitle').innerText = CONFIG.title;
            document.getElementById('cfgTagline').innerText = CONFIG.tagline;
            document.getElementById('cfgStatus').innerText = CONFIG.status;
            document.getElementById('cfgAuthor').innerText = CONFIG.author;

            // Render Metrics
            const metricsBox = document.getElementById('metricsContainer');
            metricsBox.innerHTML = CONFIG.metrics.map(m => `
                <div class="metric-item">
                    <div class="val">${m.value}</div>
                    <div class="lbl">${m.label}</div>
                </div>
            `).join('');

            // Render Links
            const linksBox = document.getElementById('linksContainer');
            linksBox.innerHTML = CONFIG.actions.map(act => {
                if(act.type === 'copy') {
                    return `
                    <div class="action-btn" onclick="copyToClipboard('${act.value}', 'Discord invite copied!')">
                        <div class="btn-content">
                            <div class="btn-icon">${act.icon}</div>
                            <div class="btn-text">
                                <div class="btn-label">${act.label}</div>
                                <div class="btn-desc">${act.desc}</div>
                            </div>
                        </div>
                        <span class="btn-chevron">📋</span>
                    </div>`;
                } else if(act.type === 'modal') {
                    return `
                    <div class="action-btn" onclick="openRules()">
                        <div class="btn-content">
                            <div class="btn-icon">${act.icon}</div>
                            <div class="btn-text">
                                <div class="btn-label">${act.label}</div>
                                <div class="btn-desc">${act.desc}</div>
                            </div>
                        </div>
                        <span class="btn-chevron">➔</span>
                    </div>`;
                } else {
                    return `
                    <a href="${act.url}" target="_blank" rel="noopener" class="action-btn">
                        <div class="btn-content">
                            <div class="btn-icon">${act.icon}</div>
                            <div class="btn-text">
                                <div class="btn-label">${act.label}</div>
                                <div class="btn-desc">${act.desc}</div>
                            </div>
                        </div>
                        <span class="btn-chevron">➔</span>
                    </a>`;
                }
            }).join('');

            // Render Rules
            const rulesBox = document.getElementById('rulesContainer');
            rulesBox.innerHTML = CONFIG.rules.map((r, idx) => `
                <div class="rule-entry">
                    <div class="rule-num">0${idx + 1}</div>
                    <div>
                        <strong style="color: var(--text-main);">${r.title}:</strong>
                        <span style="color: var(--text-muted);">${r.desc}</span>
                    </div>
                </div>
            `).join('');

            // Load saved theme
            const savedTheme = localStorage.getItem('nexus_theme');
            if(savedTheme) setTheme(savedTheme);
        }

        // --- Theme Engine ---
        function setTheme(name) {
            if(name === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', name);
            }
            localStorage.setItem('nexus_theme', name);
        }

        // --- Modal & Toast Handlers ---
        function openRules() { document.getElementById('rulesModal').style.display = 'flex'; }
        function closeRules() { document.getElementById('rulesModal').style.display = 'none'; }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = text;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 2500);
        }

        function copyToClipboard(val, successMsg) {
            navigator.clipboard.writeText(val).then(() => {
                showToast(successMsg || "Copied to clipboard!");
            });
        }

        function shareGateway() {
            if (navigator.share) {
                navigator.share({ title: CONFIG.title, url: window.location.href }).catch(() => {});
            } else {
                copyToClipboard(window.location.href, "Portal URL copied!");
            }
        }

        // --- Lightweight 60 FPS Canvas Particle Grid ---
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = 1.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.25)";
                ctx.fill();
            }
        }

        for (let i = 0; i < 40; i++) particles.push(new Particle());

        function animateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.08 * (1 - dist / 120)})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }

        animateCanvas();
        initPortal();
    </script>
</body>
</html>
